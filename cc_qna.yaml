  - context: |-
      In August 2023, the  Iowa State Fair unveiled a life-size  butter sculpture  of
      Clark. She was one of three Iowa college athletes, alongside former football
      players  Kurt Warner  ( Northern Iowa ) and  Jack Trice  ( Iowa State ), whose
      sculptures were displayed. On February 22, 2024, the  Iowa House of
      Representatives  unanimously passed a  resolution  declaring February 22 as
      "Caitlin Clark Day" in the state, in reference to her jersey number. On March 5,
      members of Iowa's federal delegation, including senators  Joni Ernst  and  Chuck
      Grassley  and representative  Mariannette Miller-Meeks , introduced a resolution
      to recognize Clark for breaking the NCAA Division I scoring record.
