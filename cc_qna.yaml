  - context: "On February 4, 2019, during her junior  season, Clark scored 60 points\
      \ in a\n90\u201378 win against  Mason City High School . Her 60-point game was\
      \ the second-\nhighest single-game point total in Iowa five-on-five girls' basketball\
      \ history,\nsurpassed only by Abby Roe in 1996. She also set the state single-game\
      \ record\nwith 13 three-pointers . On February 25, Clark set the Class 5A state\
      \ tournament\nsingle-game scoring record with 42 points in a 75\u201370 triple-overtime\
      \ win over\nWaukee High School  in the quarterfinals. She helped Dowling reach\
      \ the\nsemifinals of the tournament and finish with a 17\u20138 record. As a\
      \ junior, Clark\nled the state in scoring and averaged 32.6 points, 6.8 rebounds,\
      \ 3.6 assists and\n2.3 steals per game. She was named Iowa  Gatorade Player\
      \ of the Year  and\nrepeated as a Class 5A All-State first-team selection by\
      \ the IPSWA. As a senior\n, Clark averaged 33.4 points, eight rebounds, four\
      \ assists and 2.7 steals per\ngame, leading the state in scoring for a second\
      \ time. Her team finished with a\n19\u20134 record and reached the Class 5A\
      \ regional final, where they were upset by\nSioux City East High School . Clark\
      \ finished her career with the fourth-most\npoints (2,547) and the sixth-most\
      \ three-pointers (283) in Iowa five-on-five\nhistory. She was awarded Iowa Gatorade\
      \ Player of the Year,  Des Moines Register\nAll-Iowa Athlete of the Year, and\
      \  Iowa Miss Basketball , while making the IPSWA\nClass 5A All-State first-team.\
      \ Clark was selected to compete in the  McDonald's\nAll-American Game  and the\
      \ Jordan Brand Classic , two prestigious high school\nall-star games, but both\
      \ games were canceled due to the  COVID-19 pandemic ."
