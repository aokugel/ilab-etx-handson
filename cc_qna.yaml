      Clark won all major national player of the year awards:  AP Player of the Year ,
      the  Honda Sports Award , the  John R. Wooden Award ,  Naismith College Player
      of the Year ,  USBWA National Player of the Year  and the Wade Trophy . She was
      the first unanimous national player of the year in Big Ten history. Clark won
      the Nancy Lieberman Award for a second time and became the first three-time
      winner of the Dawn Staley Award. She was a unanimous first-team All-American for
      a second straight season, earning first-team recognition from the AP and USBWA
      and making the WBCA Coaches' All-America Team. As a junior, Clark averaged 27.8
      points, 8.6 assists and 7.1 rebounds per game, leading Division I in assists and
      ranking second in scoring. She set Big Ten single-season records in points,
      assists, three-pointers and free throws, and tied her own conference record with
      five triple-doubles. She had the fourth-most points and assists and the third-
      most three-pointers in a season in Division I history. Following the season,
      Clark won the Best Female College Athlete ESPY Award  and the  Honda Cup , both
      honoring the top women's college athlete, and the  James E. Sullivan Award ,
      presented annually by the AAU to the top college or Olympic athlete in the
      United States. She was selected as the  Big Ten Female Athlete of the Year .
