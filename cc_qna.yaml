  - context: |-
      Clark was born on January 22, 2002, in  Des Moines, Iowa , and grew up in  West
      Des Moines . She started playing basketball at age five and competed in boys'
      recreational leagues , because her father could not find a girls' league for her
      age group. Clark also played softball ,  volleyball , soccer ,  tennis , and
      golf  as a child before focusing on basketball. At age 13, she began playing
      several years ahead of her age group in girls' leagues. In  sixth grade , Clark
      joined All Iowa Attack, an Amateur Athletic Union  (AAU) basketball program
      based in  Ames, Iowa , for whom she played until graduating from high school.
      She was coached by Dickson Jensen with Attack, and her AAU teammates included
      future Women's National Basketball Association  (WNBA) player  Ashley Joens .
      Clark drew inspiration from  Maya Moore  of the  Minnesota Lynx , the closest
      WNBA team to her hometown, and traveled with her father for three-and-a-half
      hours to see their games. She admired All Iowa Attack alumnus  Harrison Barnes
      and became a fan of the  North Carolina Tar Heels  after Barnes joined the
      program.
