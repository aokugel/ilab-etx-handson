  - context: |-
      Clark was recruited by  NCAA Division I basketball programs before starting high
      school, receiving her first letter of interest from  Missouri State  before
      seventh grade. By her sophomore season at Dowling Catholic, she was ranked the
      number one player in the 2020 high school class by ESPN . At the end of her high
      school career, Clark was considered a five-star  recruit  and the fourth-best
      player in her class by ESPN. Clark's family had wanted her to choose  Notre Dame
      , and she made a verbal commitment to the school's then-head coach  Muffet
      McGraw . However, Clark never signed a National Letter of Intent  with the
      school, and soon reconsidered, announcing on November 12, 2019, that she would
      commit to play  college basketball  for Iowa  over offers from Iowa State  and
      Notre Dame. Clark was drawn to the team's up-tempo style of offense and head
      coach  Lisa Bluder 's development of point guards. She also expected to
      immediately have a key role on the team with the departure of  Kathleen Doyle ,
      the reigning  Big Ten Player of the Year .
