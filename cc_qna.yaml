      Clark was the subject of media attention ahead of the  Iowa Republican
      presidential caucuses  in January 2024. Before attending the Hawkeyes' home game
      against Minnesota, presidential candidate  Nikki Haley praised Clark in front of
      a local crowd but mistakenly called her "Caitlin Collins". Writers speculated
      that Haley confused Clark's name with  CNN  anchor  Kaitlan Collins , who joked
      about the incident on X . In the following week, Collins hosted an interview in
      Iowa with presidential candidate  Ron DeSantis , who handed her a Clark jersey
      in reference to the incident.
