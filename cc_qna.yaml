  - context: "Clark led Iowa to its second consecutive  Big Ten tournament championship,\
      \ where\nshe earned MOP honors. In the title game, she recorded 30 points, 17\
      \ assists and\n10 rebounds in a 105\u201372 win over Ohio State, the first triple-double\
      \ in the\nfinal of the tournament. Clark moved to second in Division I women's\
      \ history\nbehind  Sabrina Ionescu  of Oregon  with her 10th career triple-double.\
      \ In the\nElite Eight of the  NCAA tournament , she recorded 41 points, 12 assists\
      \ and 10\nrebounds in a 97\u201383 win over Louisville . She became the first\
      \ player in men's\nor women's tournament history to record a 30 or 40-point\
      \ triple-double. During\nthe game, Clark became the first Division I player\
      \ to record at least 900 points\nand 300 assists in a single season. For her\
      \ performance, Clark was named the\nSeattle 4 Regional MOP as Iowa reached its\
      \ first Final Four since\n(1992\u201393_Iowa_Hawkeyes_women's_basketball_team\
      \ \"wikilink\"). In the Final Four,\nshe posted 41 points, eight assists, and\
      \ six rebounds in a 77\u201373 upset win over\nundefeated defending champion\
      \  South Carolina , ending their 42-game winning\nstreak. She broke the single-game\
      \ scoring record for the women's tournament\nsemifinals and became the first\
      \ player in tournament history with consecutive\n40-point games. Clark also\
      \ surpassed the program and Big Ten single-season\nscoring records held by \
      \ Megan Gustafson . With the win, Iowa advanced to their\nfirst women's basketball\
      \ championship game in program history. Though Clark had\n30 points and eight\
      \ assists against LSU  in the national championship , Iowa\nlost the game, 102\u2013\
      85. She made eight three-pointers, the most by a men's or\nwomen's player in\
      \ the title game. Near the end of the game, LSU star  Angel\nReese  followed\
      \ Clark, making a \" you can't see me \" gesture implying that Clark\ncould\
      \ not keep up with her, and also pointing to her ring finger in reference to\n\
      LSU's imminent  championship ring . Reese received considerable criticism for\n\
      the gestures, which many in the media viewed as unsportsmanlike . However, many\n\
      also defended Reese's gestures and  trash talk , highlighting a double standard,\n\
      as Clark had made the same gesture at a previous game and did not face similar\n\
      criticism. Clark herself defended Reese over criticism about the gesture. In\n\
      coverage of this incident, journalists and the public have commented on the\n\
      roles of race and gender in perceptions of sportsmanship. With 191 points in\
      \ the\ntournament, Clark broke the men's and women's scoring records for a single\
      \ NCAA\ntournament. Her 60 assists were the most by a player in women's tournament\n\
      history."
